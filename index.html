<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Systems Analysis &amp; SDLC Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- Start screen -->
    <section id="start" class="card screen">
      <h1>Systems Analysis &amp; SDLC Quiz</h1>
      <p class="muted"><span id="total-count">100</span> multiple-choice questions. Pick A, B, C, or D.</p>
      <div class="options-box">
        <label class="toggle"><input type="checkbox" id="opt-shuffle-q" checked> Shuffle questions</label>
        <label class="toggle"><input type="checkbox" id="opt-shuffle-c" checked> Shuffle answer choices</label>
      </div>
      <button id="btn-start" class="btn primary">Start quiz</button>
      <p class="muted small" id="best-score"></p>
    </section>

    <!-- Quiz screen -->
    <section id="quiz" class="card screen hidden" aria-live="polite">
      <div class="topbar">
        <span id="counter">Question 1 / 100</span>
        <span id="score">Score: 0</span>
      </div>
      <div class="progress" aria-hidden="true"><div id="bar"></div></div>
      <h2 id="question"></h2>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback hidden"></div>
      <div class="actions">
        <button id="btn-quit" class="btn ghost">End quiz</button>
        <button id="btn-next" class="btn primary" disabled>Next</button>
      </div>
      <p class="muted small hint">Tip: press A&ndash;D (or 1&ndash;4) to answer, Enter to continue.</p>
    </section>

    <!-- Results screen -->
    <section id="results" class="card screen hidden">
      <h1>Results</h1>
      <div class="big-score"><span id="res-score">0</span><span class="of"> / <span id="res-total">0</span></span></div>
      <p id="res-percent" class="muted"></p>
      <p id="res-msg"></p>
      <div class="actions wrap">
        <button id="btn-retry" class="btn primary">Retake quiz</button>
        <button id="btn-retry-missed" class="btn">Retry missed only</button>
        <button id="btn-home" class="btn ghost">Home</button>
      </div>
      <h2 id="review-title" class="hidden">Review missed questions</h2>
      <div id="review"></div>
    </section>

  </main>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
